<!doctype html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f9fe"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Mediora — demo</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182b48;background:#f6f9fe}
*{box-sizing:border-box}body{margin:0}.app{max-width:1100px;margin:auto;padding:22px 18px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-1.2px}
.logo{background:#e1edff;color:#2763bc;border-radius:14px;width:44px;height:44px;display:grid;place-items:center;font-size:25px}
select,input,textarea,button{font:inherit}select,input,textarea{border:1px solid #dce5f1;border-radius:12px;padding:12px;background:#fff;color:#182b48;max-width:100%;width:100%}
textarea{min-height:105px;resize:vertical}button{border:0;border-radius:12px;padding:12px 16px;background:#2367c8;color:white;cursor:pointer;font-weight:650}
button.secondary{background:#e9f1fc;color:#235aa8}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9cc4ff}
.hero{background:linear-gradient(125deg,#e7f1ff,#f8fbff);border:1px solid #dbe8fa;border-radius:24px;padding:26px;margin-bottom:22px}
h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}h2{font-size:22px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}
p{line-height:1.5;color:#5a6d86}.tag{font-size:12px;color:#50719c;background:#e8f1fd;padding:6px 9px;border-radius:100px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-bottom:22px}
nav button{background:white;color:#375475;border:1px solid #e0e9f5;padding:14px 8px;font-size:13px}
nav button.active{background:#2367c8;color:white}.panel{background:white;border:1px solid #e1eaf4;border-radius:20px;padding:22px;box-shadow:0 5px 18px #234d8508}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.tile{padding:20px;border:1px solid #e1eaf4;border-radius:16px;background:white;text-align:left;color:#183f76}
.tile span{font-size:26px;display:block;margin-bottom:12px}.tile strong{display:block}.tile small{color:#70829a;display:block;margin-top:5px}
label{display:block;font-size:13px;font-weight:650;margin:13px 0 6px}.output{white-space:pre-wrap;background:#f5f8fc;border:1px solid #dce5f1;padding:18px;border-radius:14px;min-height:100px;line-height:1.55}
.muted{color:#718198;font-size:13px}.notice{padding:12px;background:#fff8e9;border:1px solid #f3dfac;border-radius:12px;color:#755b21;font-size:13px;margin-bottom:16px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hidden{display:none}.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
footer{margin-top:24px;font-size:12px;color:#75859a}
@media(max-width:680px){nav{grid-template-columns:repeat(2,1fr)}.grid,.cols{grid-template-columns:1fr}.app{padding:16px 12px 40px}.panel{padding:17px}h1{font-size:24px}}
</style></head>
<body><div class="app"><header><div class="brand"><div class="logo">♡</div>mediora<span style="color:#2763bc">.</span></div><div style="width:155px"><select id="language" aria-label="Language"><option value="pl">🇵🇱 Polski</option><option value="en">🇬🇧 English</option><option value="uk">🇺🇦 Українська</option></select></div></header>
<section class="hero"><span class="tag" id="demoTag">PROTOTYP • offline</span><h1 id="greeting"></h1><p id="intro"></p></section>
<nav id="tabs"></nav><main id="content" class="panel"></main><footer id="footer"></footer></div>
<script>
const I={
pl:{hello:"Dzień dobry, Doktorze!",intro:"Twój przejrzysty warsztat kliniczny. Pierwszy działający prototyp Mediory.",tabs:["Pulpit","Dokumentacja","Wiedza medyczna","Leki i refundacja","Kalkulatory"],welcome:"Wybierz narzędzie",cards:[["📝","Dokumentacja","Przyjęcia, obserwacje, epikryzy"],["📚","Wiedza medyczna","Miejsce na zweryfikowane wytyczne"],["💊","Leki i refundacja","Przyszła integracja z ChPL i MZ"],["🧮","Kalkulatory","Działający kalkulator BMI"]],docTitle:"Generator dokumentacji",docType:"Rodzaj dokumentu",types:["Obserwacja","Przyjęcie","Epikryza"],context:"Dane kliniczne (bez danych identyfikujących pacjenta)",exam:"Stan pacjenta / badanie przedmiotowe",plan:"Leczenie i plan",generate:"Utwórz szkic",copy:"Kopiuj tekst",download:"Pobierz .txt",placeholder:"Wpisz fakty kliniczne — bez nazwisk, PESEL i dat urodzenia",notice:"Wersja demonstracyjna: nie wpisuj danych osobowych ani rzeczywistych danych pacjentów. Generator porządkuje wyłącznie podane informacje — nie podejmuje decyzji klinicznych.",empty:"Wypełnij pola i wybierz „Utwórz szkic”.",knowledge:"Wiedza medyczna",knowledgeText:"Tu pojawią się zweryfikowane wytyczne, algorytmy i źródła z datami aktualizacji. Nie udajemy, że prototyp ma już aktualną bazę medyczną.",meds:"Leki i refundacja",medsText:"Planowane: oficjalne ChPL, dawkowanie, przeciwwskazania oraz polskie dane refundacyjne z datą obowiązywania. Integracja jeszcze nie została wykonana.",calc:"Kalkulatory",weight:"Masa ciała (kg)",height:"Wzrost (cm)",calculate:"Oblicz BMI",result:"Wynik BMI",footer:"Mediora • prototyp lokalny • bez połączenia z AI i bez przechowywania danych na serwerze",missing:"Wprowadź prawidłową masę i wzrost.",saved:"Skopiowano",copyFail:"Nie udało się skopiować. Zaznacz tekst ręcznie.",sections:["Informacje kliniczne","Stan aktualny / badanie","Postępowanie / plan"],draft:"SZKIC — DO WERYFIKACJI PRZEZ LEKARZA"},
en:{hello:"Welcome, Doctor!",intro:"Your streamlined clinical workspace. The first working Mediora prototype.",tabs:["Home","Documentation","Medical knowledge","Drugs & reimbursement","Calculators"],welcome:"Choose a tool",cards:[["📝","Documentation","Admissions, progress notes, discharge summaries"],["📚","Medical knowledge","Space for verified guidelines"],["💊","Drugs & reimbursement","Future SmPC and reimbursement integration"],["🧮","Calculators","Working BMI calculator"]],docTitle:"Documentation generator",docType:"Document type",types:["Progress note","Admission note","Discharge summary"],context:"Clinical information (no patient identifiers)",exam:"Current condition / examination",plan:"Treatment and plan",generate:"Create draft",copy:"Copy text",download:"Download .txt",placeholder:"Enter clinical facts — no names, IDs or birth dates",notice:"Demo only: do not enter personal data or real patient information. This generator only formats supplied facts; it does not make clinical decisions.",empty:"Fill in the fields and select Create draft.",knowledge:"Medical knowledge",knowledgeText:"Verified guidelines, algorithms and dated sources will be added here. This prototype does not claim to have an up-to-date medical knowledge base.",meds:"Drugs & reimbursement",medsText:"Planned: official SmPCs, doses, contraindications and Polish reimbursement data with effective dates. Not yet connected.",calc:"Calculators",weight:"Weight (kg)",height:"Height (cm)",calculate:"Calculate BMI",result:"BMI result",footer:"Mediora • local prototype • no AI connection or server-side data storage",missing:"Enter valid weight and height.",saved:"Copied",copyFail:"Copy failed. Select the text manually.",sections:["Clinical information","Current condition / examination","Management / plan"],draft:"DRAFT — REQUIRES CLINICIAN REVIEW"},
uk:{hello:"Вітаємо, лікарю!",intro:"Ваш зручний клінічний простір. Перший робочий прототип Mediora.",tabs:["Головна","Документація","Медичні знання","Ліки та реімбурсація","Калькулятори"],welcome:"Оберіть інструмент",cards:[["📝","Документація","Приймання, щоденники, виписки"],["📚","Медичні знання","Місце для перевірених настанов"],["💊","Ліки та реімбурсація","Майбутня інтеграція інструкцій і відшкодування"],["🧮","Калькулятори","Калькулятор ІМТ"]],docTitle:"Генератор документації",docType:"Тип документа",types:["Щоденник","Первинний огляд","Виписка"],context:"Клінічні дані (без ідентифікаторів пацієнта)",exam:"Поточний стан / огляд",plan:"Лікування та план",generate:"Створити чернетку",copy:"Копіювати",download:"Завантажити .txt",placeholder:"Введіть клінічні факти — без імен, номерів і дат народження",notice:"Лише демонстрація: не вводьте персональні дані або реальні дані пацієнтів. Генератор лише впорядковує введену інформацію та не приймає клінічних рішень.",empty:"Заповніть поля та натисніть «Створити чернетку».",knowledge:"Медичні знання",knowledgeText:"Тут з'являться перевірені настанови, алгоритми та джерела з датами оновлення. Наразі актуальної медичної бази немає.",meds:"Ліки та реімбурсація",medsText:"Заплановано: офіційні інструкції, дозування, протипоказання та польські дані реімбурсації. Інтеграція ще не виконана.",calc:"Калькулятори",weight:"Маса тіла (кг)",height:"Зріст (см)",calculate:"Розрахувати ІМТ",result:"Результат ІМТ",footer:"Mediora • локальний прототип • без AI та збереження даних на сервері",missing:"Введіть коректну масу та зріст.",saved:"Скопійовано",copyFail:"Не вдалося скопіювати. Виділіть текст вручну.",sections:["Клінічна інформація","Поточний стан / огляд","Лікування / план"],draft:"ЧЕРНЕТКА — ПОТРЕБУЄ ПЕРЕВІРКИ ЛІКАРЕМ"}};
let lang='pl',tab=0,draft='';
const $=id=>document.getElementById(id);
function el(tag,attrs={},txt=''){const n=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));n.textContent=txt;return n}
function render(){const t=I[lang];document.documentElement.lang=lang;$('greeting').textContent=t.hello;$('intro').textContent=t.intro;$('footer').textContent=t.footer;
const tabs=$('tabs');tabs.replaceChildren();t.tabs.forEach((label,i)=>{const b=el('button',{class:i===tab?'active':''},label);b.onclick=()=>{tab=i;render()};tabs.append(b)});
const c=$('content');c.replaceChildren();const h=el('h2',{},tab===0?t.welcome:tab===1?t.docTitle:tab===2?t.knowledge:tab===3?t.meds:t.calc);c.append(h);
if(tab===0){const g=el('div',{class:'grid'});t.cards.forEach(([ico,title,desc],i)=>{const b=el('button',{class:'tile'});b.append(el('span',{},ico),el('strong',{},title),el('small',{},desc));b.onclick=()=>{tab=i+1;render()};g.append(b)});c.append(g)}
if(tab===1){c.append(el('div',{class:'notice'},t.notice));let label=el('label',{},t.docType);c.append(label);const sel=el('select',{id:'doctype'});t.types.forEach((s,i)=>sel.append(el('option',{value:i},s)));c.append(sel);
[['context',t.context],['exam',t.exam],['plan',t.plan]].forEach(([id,name])=>{c.append(el('label',{},name),el('textarea',{id,placeholder:t.placeholder}))});
const acts=el('div',{class:'actions'}),gen=el('button',{},t.generate),copy=el('button',{class:'secondary'},t.copy),dl=el('button',{class:'secondary'},t.download),out=el('div',{class:'output',id:'output'},t.empty);acts.append(gen,copy,dl);c.append(acts,el('h3',{style:'margin-top:24px'},t.draft),out);
gen.onclick=()=>{const fields=['context','exam','plan'].map(id=>$(id).value.trim());draft=[t.draft,t.types[Number(sel.value)].toUpperCase(),...fields.map((v,i)=>t.sections[i]+':\n'+(v||'—'))].join('\n\n');out.textContent=draft};
copy.onclick=async()=>{if(!draft)return;try{await navigator.clipboard.writeText(draft);copy.textContent=t.saved;setTimeout(()=>copy.textContent=t.copy,1500)}catch{alert(t.copyFail)}};
dl.onclick=()=>{if(!draft)return;const a=document.createElement('a');const url=URL.createObjectURL(new Blob([draft],{type:'text/plain;charset=utf-8'}));a.href=url;a.download='mediora-draft.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
}
if(tab===2||tab===3){c.append(el('div',{class:'notice'},tab===2?t.knowledgeText:t.medsText))}
if(tab===4){const grid=el('div',{class:'cols'});[['weight',t.weight],['height',t.height]].forEach(([id,name])=>{const box=el('div');box.append(el('label',{},name),el('input',{id,type:'number',min:'1',step:'any',inputmode:'decimal'}));grid.append(box)});c.append(grid);const b=el('button',{style:'margin:16px 0'},t.calculate),out=el('div',{class:'output'},'—');c.append(b,out);b.onclick=()=>{const w=Number($('weight').value),h=Number($('height').value);out.textContent=w>0&&h>0&&h<300?`${t.result}: ${(w/(h/100)**2).toFixed(1)}`:t.missing}}
}
$('language').onchange=e=>{lang=e.target.value;draft='';render()};render();


</script></body></html>
